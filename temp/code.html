<!DOCTYPE html>

<html class="dark" lang="ru"><head>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col items-center justify-center">
<main class="w-full max-w-md px-container-margin flex flex-col items-center justify-center min-h-screen space-y-xl">
<div class="flex flex-col items-center space-y-md w-full">

<div class="text-center space-y-sm">
<h1 class="font-headline-lg text-headline-lg uppercase text-on-background">Добро пожаловать</h1>
</div>
</div>
<div class="w-full bg-[#1A1C1C] border border-outline p-xl flex flex-col space-y-lg">
<div class="space-y-sm">
<input class="w-full bg-transparent border-0 border-b-2 border-outline focus:border-primary focus:ring-0 text-on-background font-headline-md text-headline-md placeholder:text-[#555555] transition-colors py-sm" id="user_name" placeholder="Введите ваше имя" type="text"/>
</div>
<button class="w-full bg-primary py-md px-lg transition-transform active:scale-[0.98]">
<span class="font-headline-md text-headline-md text-on-background uppercase tracking-tight">Начать тренировку</span>
</button>
</div>
<div class="text-center px-lg">
<p class="text-[#555555] font-label-caps text-[10px] leading-relaxed uppercase tracking-wider">
                Продолжая, вы соглашаетесь с нашей политикой конфиденциальности и условиями использования.
            </p>
</div>
</main>
<div class="fixed top-0 left-0 w-full p-gutter flex justify-between items-center">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[20px]">fitness_center</span>
<span class="font-headline-md text-headline-md text-on-background tracking-tighter">IRON TRACK</span>
</div>
<div class="flex gap-md">
<span class="material-symbols-outlined text-[#555555]">settings</span>
<span class="material-symbols-outlined text-[#555555]">help_outline</span>
</div>
</div>
<div class="fixed bottom-gutter left-gutter right-gutter h-[1px] bg-outline opacity-20"></div>
