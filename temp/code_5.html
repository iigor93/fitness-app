</div>
<!-- Frequency Grid (Asymmetric Selection) -->
<div class="space-y-md">
<label class="font-label-caps text-label-caps text-on-surface-variant block">КОЛИЧЕСТВО ДНЕЙ В НЕДЕЛЮ</label>
<div class="grid grid-cols-4 gap-sm">
<button class="border-2 border-secondary-container p-lg flex flex-col items-center justify-center gap-xs hover:border-primary transition-all active:scale-95 group" type="button">
<span class="font-display-lg text-display-lg">2</span>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-primary">ДНЯ</span>
</button>
<button class="border-2 border-primary-container bg-surface-container-highest p-lg flex flex-col items-center justify-center gap-xs active:scale-95 group" type="button">
<span class="font-display-lg text-display-lg text-primary">3</span>
<span class="font-label-caps text-label-caps text-primary">ДНЯ</span>
</button>

<span class="font-display-lg text-display-lg">4</span>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-primary">ДНЯ</span>
</button>
<button class="border-2 border-secondary-container p-lg flex flex-col items-center justify-center gap-xs hover:border-primary transition-all active:scale-95 group" type="button">
<span class="font-display-lg text-display-lg">5</span>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-primary">ДНЕЙ</span>
</button>
</div>
</div>

<div class="bg-surface-container-low border border-secondary-container p-md flex items-center justify-between">
<div class="flex items-center gap-md">
<div class="w-12 h-12 flex items-center justify-center bg-primary-container rounded">
<span class="material-symbols-outlined text-on-primary-container" data-icon="bolt">bolt</span>
</div>
<div>
<p class="font-headline-md text-[18px] text-on-background">Режим высокой интенсивности</p>

</div>
<div class="w-14 h-8 bg-secondary-container rounded-full relative flex items-center px-1">
